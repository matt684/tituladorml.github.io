<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fichador</title>
  <style>
    :root { --bg:#0b1020; --fg:#f5f5f5; --accent:#4f46e5; --danger:#e53e3e; --muted:#9aa0b3; --card:#1e263d; --success:#16a34a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", sans-serif; background:var(--bg); color:var(--fg); }
    .container { display:flex; flex-direction:column; gap:16px; padding:20px; align-items:center; min-height:100vh; max-width:480px; margin:auto; }

    button.main { border:none; padding:20px; border-radius:22px; font-size:1.3rem; font-weight:600; cursor:pointer; transition: transform .05s ease; width:100%; color:white; }
    #ficharBtn { background:var(--accent); box-shadow: 0 8px 20px rgba(79,70,229,.35); }
    button.main:active { transform: scale(.98); }

    .secondary-actions { display:flex; flex-wrap:wrap; gap:10px; width:100%; }
    .secondary-actions button, .secondary-actions input { flex:1; border:none; padding:10px; border-radius:12px; font-size:.85rem; font-weight:600; cursor:pointer; }
    #resetBtn { background:var(--danger); box-shadow: 0 4px 8px rgba(229,62,62,.3); color:white; }
    #downloadBtn { background:var(--success); box-shadow: 0 4px 8px rgba(22,163,74,.3); color:white; }
    .secondary-actions input { background:#fff; color:#000; cursor:text; text-align:center; }

    .panel { width:100%; background:var(--card); border-radius:16px; padding:12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); margin-top:8px; }
    .panel h2 { margin:0 0 12px; font-size:1rem; font-weight:600; color:var(--muted); text-align:center; }

    .cards { display:flex; flex-direction:column; gap:10px; }
    .card { background:rgba(255,255,255,.05); padding:12px; border-radius:12px; box-shadow:0 3px 6px rgba(0,0,0,.25); }
    .card-header { font-size:.9rem; font-weight:600; color:var(--fg); margin-bottom:8px; text-align:center; }
    .card-body { display:flex; flex-direction:column; gap:6px; }
    .slot { display:flex; justify-content:space-between; padding:6px 8px; background:rgba(0,0,0,.2); border-radius:8px; }
    .slot span { font-weight:600; }
    .slot.deletable { cursor:pointer; }
    .slot.deletable.active-hold { background:rgba(229,62,62,.4) !important; }

    .footer { margin-top:10px; font-size:.8rem; color:var(--muted); text-align:center; }
    .legend { margin-top:6px; font-size:.75rem; color:var(--muted); text-align:center; }

    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:100; }
    .modal-content { background:var(--card); padding:20px; border-radius:12px; text-align:center; max-width:280px; width:85%; color:var(--fg); box-shadow:0 6px 16px rgba(0,0,0,.5); }
    .modal-buttons { display:flex; justify-content:space-around; margin-top:16px; gap:10px; }
    .modal-buttons button { flex:1; padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:.9rem; }
    .confirm { background:var(--danger); color:#fff; }
    .cancel { background:var(--muted); color:#000; }

    .nav-days { display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px; flex-wrap:wrap; }
    .nav-days button, .nav-days input { flex:1; border:none; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:.8rem; }
    .nav-days button { background:var(--accent); color:#fff; font-weight:600; }
    .nav-days input { background:#fff; color:#000; cursor:text; }
  </style>
</head>
<body>
  <div class="container">
    <button id="ficharBtn" class="main" aria-label="Fichar">⏱️ Fichar</button>

    <div class="secondary-actions">
      <button id="resetBtn" aria-label="Reset">🔄 Reset</button>
      <input type="date" id="fromDate" />
      <input type="date" id="toDate" />
      <button id="downloadBtn" aria-label="Descargar">💾 Descargar</button>
    </div>

    <div class="panel" aria-live="polite" aria-atomic="false">
      <h2 id="panelTitle">Registros</h2>
      <div class="cards" id="cards"></div>
      <div class="nav-days">
        <button id="prevDay">⬅️ Día anterior</button>
        <input type="date" id="jumpDate" />
        <button id="nextDay">➡️ Día siguiente</button>
      </div>
      <div class="footer" id="hint"></div>
      <div class="legend">Tip: mantené apretada una fichada para borrarla.</div>
    </div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <p>¿Estás seguro de que querés borrar esta fichada?</p>
      <div class="modal-buttons">
        <button id="confirmYes" class="confirm">Sí</button>
        <button id="confirmNo" class="cancel">No</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const STORAGE_KEY = 'fichador_v1';
    const btn = document.getElementById('ficharBtn');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const cards = document.getElementById('cards');
    const hint = document.getElementById('hint');
    const modal = document.getElementById('confirmModal');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');
    const panelTitle = document.getElementById('panelTitle');
    const prevDayBtn = document.getElementById('prevDay');
    const nextDayBtn = document.getElementById('nextDay');
    const jumpDateInput = document.getElementById('jumpDate');
    const fromDateInput = document.getElementById('fromDate');
    const toDateInput = document.getElementById('toDate');

    let pendingDelete = null;
    let currentDate = new Date();

    const load = () => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ return {}; }
    };

    const save = (data) => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
    };

    const formatDate = (d) => d.toISOString().slice(0,10);
    const formatTime = (d) => d.toLocaleTimeString('es-AR',{hour12:false});

    const state = load();

    const render = () => {
      cards.innerHTML = '';
      const fecha = formatDate(currentDate);
      const registros = state[fecha] || [];

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="card-header">${fecha}</div>`;

      const body = document.createElement('div');
      body.className = 'card-body';

      const labels = ['Ingreso','Corte Ingreso','Corte Salida','Salida'];
      labels.forEach((label,i) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        if(registros[i]){
          slot.classList.add('deletable');
          slot.innerHTML = `<span>${label}</span><span>${registros[i]}</span>`;
          let pressTimer;
          const startHold = () => {
            slot.classList.add('active-hold');
            pressTimer = setTimeout(() => {
              slot.classList.remove('active-hold');
              pendingDelete = { registros, index: i, fecha };
              modal.style.display='flex';
            }, 800);
          };
          const cancelHold = () => {
            clearTimeout(pressTimer);
            slot.classList.remove('active-hold');
          };
          slot.addEventListener('touchstart', startHold);
          slot.addEventListener('touchend', cancelHold);
          slot.addEventListener('mousedown', startHold);
          slot.addEventListener('mouseup', cancelHold);
          slot.addEventListener('mouseleave', cancelHold);
        } else {
          slot.innerHTML = `<span>${label}</span><span>--</span>`;
        }
        body.appendChild(slot);
      });

      card.appendChild(body);
      cards.appendChild(card);

      panelTitle.textContent = `Registros del ${fecha}`;
      hint.textContent = `${fecha === formatDate(new Date()) ? 'Hoy' : fecha}: ${registros.filter(Boolean).length}/4 fichadas.`;

      jumpDateInput.value = fecha;
    };

    btn.addEventListener('click', () => {
      const today = formatDate(new Date());
      if(formatDate(currentDate) !== today){
        alert('Solo podés fichar en el día actual');
        return;
      }
      const now = new Date();
      if(!state[today]) state[today] = [];
      const registros = state[today];
      if(registros.filter(Boolean).length >= 4){
        alert('Ya registraste las 4 fichadas de hoy');
        return;
      }
      let idx = registros.findIndex(x => !x);
      if(idx === -1) idx = registros.length;
      registros[idx] = formatTime(now);
      state[today] = registros;
      save(state);
      render();
    });

    resetBtn.addEventListener('click', () => {
      if(confirm('¿Seguro que querés resetear todos los registros?')){
        for(let key in state) delete state[key];
        save(state);
        render();
      }
    });

    downloadBtn.addEventListener('click', () => {
      let csv = 'Fecha,Ingreso,Corte Ingreso,Corte Salida,Salida\n';
      const from = fromDateInput.value;
      const to = toDateInput.value;
      const entries = Object.entries(state).sort(([a],[b]) => a.localeCompare(b));
      for(const [fecha, registros] of entries){
        if((!from || fecha >= from) && (!to || fecha <= to)){
          csv += `${fecha},${registros[0]||''},${registros[1]||''},${registros[2]||''},${registros[3]||''}\n`;
        }
      }
      const blob = new Blob([csv], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url;
      a.download='fichadas.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    prevDayBtn.addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() - 1);
      render();
    });

    nextDayBtn.addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() + 1);
      render();
    });

    jumpDateInput.addEventListener('change', () => {
      const val = jumpDateInput.value;
      if(val){
        currentDate = new Date(val);
        render();
      }
    });

    confirmYes.addEventListener('click', () => {
      if(pendingDelete){
        pendingDelete.registros[pendingDelete.index] = '';
        state[pendingDelete.fecha] = pendingDelete.registros;
        save(state);
        render();
        pendingDelete = null;
      }
      modal.style.display='none';
    });

    confirmNo.addEventListener('click', () => {
      pendingDelete = null;
      modal.style.display='none';
    });

    render();
  })();
  </script>
</body>
</html>
